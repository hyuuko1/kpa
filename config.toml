[safety]
# 最大允许查询时间跨度（小时），默认 48 小时
max_time_span_hours = 48
# 是否强制要求 query 必须包含 dt: 时间范围
require_time_filter = true
# --since-last 单批次最大时间跨度（小时）
chunk_hours = 24
# --since-last 最大自动追溯上限（小时）
max_catchup_hours = 72
# 邮件列表投递延迟容差（分钟）
overlap_grace_minutes = 10

[storage]
# 数据全局根目录（包含 kp.db, patchsets/, reports/, runs/）
data_dir = "data"

[lore]
# 默认使用的 lore public-inbox 地址
inbox_url = "https://lore.kernel.org/all/"
# lei 命令执行超时时间（秒）
timeout_seconds = 60

[kernel]
# Linux 内核源码代码路径
path = "/code/linux"

[agent]
default = "agy"
agy_cmd = "agy"
opencode_cmd = "opencode"
timeout_seconds = 1200
concurrency = 1
