[safety]
# 最大允许查询时间跨度（小时），默认 48 小时
max_time_span_hours = 48
# 是否强制要求 query 必须包含 d: 时间范围
require_time_filter = true

[lore]
# 默认使用的 lore public-inbox 地址
inbox_url = "https://lore.kernel.org/all/"
# lei 命令执行超时时间（秒）
timeout_seconds = 60

[kernel]
# Linux 内核源码代码路径
path = "/code/linux"

[agent]
default = "agy"
agy_cmd = "agy"
opencode_cmd = "opencode"
timeout_seconds = 1200
concurrency = 1
